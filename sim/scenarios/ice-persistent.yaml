# SPDX-License-Identifier: FSL-1.1-ALv2
name: ice-persistent
description: >-
  No instance type has capacity at all. Nothing launches; after QueueFailAfter the waiting work is failed fast
  with a clear message (R-RE-2) and new work keeps failing fast while capacity stays unavailable. Zero cost.
seed: 7
duration: 30m
fleet:
  queueFailAfter: 10m
  pools:
    - name: linux-x86-64
      provider: ec2
      platform: linux-x86-64
      runners:
        - name: native
          properties: {OSFamily: linux, ISA: x86-64}
          concurrency: 8
      vcpus: 8
      max: 4
      idleTimeout: 5m
      startupTimeout: 5m
      instanceTypes: [c8i.2xlarge, c7i.2xlarge]
      subnets: [subnet-a, subnet-b]
workload:
  arrivals:
    - {at: 30s, pool: linux-x86-64, count: 30, duration: 20s}
    - {at: 20m, pool: linux-x86-64, count: 10, duration: 20s}
faults:
  - {at: 0s, kind: ice, pool: linux-x86-64}
expectations:
  minFailed: 40
  maxFailWait: 11m
  maxLaunches: {linux-x86-64: 0}
  endAtZero: true
