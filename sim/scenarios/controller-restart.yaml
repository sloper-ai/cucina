# SPDX-License-Identifier: FSL-1.1-ALv2
name: controller-restart
description: >-
  The controller restarts right after issuing launches, before recording their results (mid-scale), and again
  later while VMs drain. The new leader rebuilds state from the tag-filtered Describe, the scheduler's worker list
  and the persisted launch ledger: it never double-launches, never terminates a busy worker and still scales the
  pool back to zero (R-SCALE-5, NFR-R3).
seed: 9
duration: 30m
fleet:
  compute:
    visibleMax: 20s
  pools:
    - name: linux-x86-64
      provider: ec2
      platform: linux-x86-64
      runners:
        - name: native
          properties: {OSFamily: linux, ISA: x86-64}
          concurrency: 8
      vcpus: 8
      max: 4
      idleTimeout: 5m
      startupTimeout: 5m
      instanceTypes: [c8i.2xlarge, c7i.2xlarge]
      subnets: [subnet-a, subnet-b]
workload:
  arrivals:
    - {at: 30s, pool: linux-x86-64, count: 300, duration: 20s}
    - {at: 14m, pool: linux-x86-64, count: 50, duration: 3m}
faults:
  - {at: 25s, kind: controller-restart, midScale: true}
  - {at: 18m, kind: controller-restart}
  - {at: 23m, kind: controller-restart}
expectations:
  allSucceed: true
  endAtZero: true
  maxInstances: {linux-x86-64: 4}
  maxLaunches: {linux-x86-64: 8}
