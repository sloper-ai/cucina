# SPDX-License-Identifier: FSL-1.1-ALv2
name: throttling
description: >-
  Two pools burst at once while EC2 throttles RunInstances hard (burst 1, refill 0.05/s) for 5 minutes. The
  shared API budget limits launches per decision, throttled calls back off and keep their idempotency token, and
  no duplicate instance is ever created (R-SCALE-6).
seed: 8
duration: 30m
fleet:
  pools:
    - name: linux-x86-64
      provider: ec2
      platform: linux-x86-64
      runners:
        - name: native
          properties: {OSFamily: linux, ISA: x86-64}
          concurrency: 8
      vcpus: 8
      max: 4
      idleTimeout: 5m
      startupTimeout: 5m
      instanceTypes: [c8i.2xlarge, c7i.2xlarge]
      subnets: [subnet-a, subnet-b]
    - name: linux-aarch64
      provider: ec2
      platform: linux-aarch64
      runners:
        - name: native
          properties: {OSFamily: linux, ISA: arm-a64}
          concurrency: 8
      vcpus: 8
      max: 6
      idleTimeout: 5m
      startupTimeout: 5m
      instanceTypes: [c8g.2xlarge, c7g.2xlarge]
workload:
  arrivals:
    - {at: 20s, pool: linux-x86-64, count: 300, duration: 20s}
    - {at: 20s, pool: linux-aarch64, count: 400, duration: 20s}
faults:
  - {at: 0s, kind: throttle, value: 1, rate: 0.05, duration: 5m}
expectations:
  allSucceed: true
  endAtZero: true
  maxInstances: {linux-x86-64: 4, linux-aarch64: 6}
  maxLaunches: {linux-x86-64: 4, linux-aarch64: 6}
  queueWaitMax: 10m
