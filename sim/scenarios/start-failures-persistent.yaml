# SPDX-License-Identifier: FSL-1.1-ALv2
name: start-failures-persistent
description: >-
  Every launched VM fails to register (persistent provisioning failure). After QueueFailAfter with work waiting
  and no worker, the queued work is failed with a clear FAILED_PRECONDITION instead of hanging (R-RE-2,
  R-SCALE-4); relaunches back off so cost stays bounded.
seed: 5
duration: 40m
fleet:
  queueFailAfter: 10m
  pools:
    - name: linux-x86-64
      provider: ec2
      platform: linux-x86-64
      runners:
        - name: native
          properties: {OSFamily: linux, ISA: x86-64}
          concurrency: 8
      vcpus: 8
      max: 4
      idleTimeout: 5m
      startupTimeout: 5m
      instanceTypes: [c8i.2xlarge, c7i.2xlarge]
      subnets: [subnet-a, subnet-b]
workload:
  arrivals:
    - {at: 30s, pool: linux-x86-64, count: 20, duration: 30s}
    - {at: 25m, pool: linux-x86-64, count: 5, duration: 30s}
faults:
  - {at: 0s, kind: start-failure, pool: linux-x86-64}
expectations:
  minFailed: 25
  maxFailWait: 17m
  maxInstances: {linux-x86-64: 4}
  maxLaunches: {linux-x86-64: 8}
  endAtZero: true
