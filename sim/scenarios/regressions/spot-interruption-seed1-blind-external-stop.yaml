# SPDX-License-Identifier: FSL-1.1-ALv2
name: spot-interruption-seed1-blind-external-stop
description: >-
  Regression (sweep, spot-interruption-chaos seed 1): two busy instances were interrupted by EC2 while the
  scheduler was unreachable. The planner re-issued terminate for the externally stopping VMs using their stale busy
  count (caught by the never-terminate-busy guard). Fix: only stops the controller sent are ever re-issued.
seed: 1
duration: 15m
fleet:
  pools:
    - name: linux-x86-64
      provider: ec2
      platform: linux-x86-64
      runners:
        - name: native
          properties: {OSFamily: linux, ISA: x86-64}
          concurrency: 8
      vcpus: 8
      max: 4
      idleTimeout: 5m
      startupTimeout: 5m
      instanceTypes: [c8i.2xlarge, c7i.2xlarge]
      subnets: [subnet-a, subnet-b]
workload:
  arrivals:
    - {at: 30s, pool: linux-x86-64, count: 400, duration: 30s}
faults:
  - {at: 2m23s, kind: network-cut, duration: 53s}
  - {at: 3m, kind: spot-interruption, pool: linux-x86-64, count: 2}
expectations:
  allSucceed: true
  endAtZero: true
