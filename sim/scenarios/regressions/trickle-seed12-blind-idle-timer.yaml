# SPDX-License-Identifier: FSL-1.1-ALv2
name: trickle-seed12-blind-idle-timer
description: >-
  Regression (sweep, trickle-chaos seed 12): the scheduler was unreachable for 2m11s while one action ran on the
  only VM. The idle timer kept counting through the blind period, so the VM was drained for idleness 2m40s after
  it was last busy (< idleTimeout). Fix: an observation gap restarts idle and queue-empty timers.
seed: 12
duration: 10m
fleet:
  pools:
    - name: linux-x86-64
      provider: ec2
      platform: linux-x86-64
      runners:
        - name: native
          properties: {OSFamily: linux, ISA: x86-64}
          concurrency: 8
      vcpus: 8
      max: 4
      idleTimeout: 5m
      startupTimeout: 5m
      instanceTypes: [c8i.2xlarge, c7i.2xlarge]
      subnets: [subnet-a, subnet-b]
workload:
  arrivals:
    - {at: 10s, pool: linux-x86-64, count: 4, every: 3m, duration: 5s}
faults:
  - {at: 2m39s, kind: network-cut, duration: 2m11s}
expectations:
  allSucceed: true
  endAtZero: true
