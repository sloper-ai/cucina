# SPDX-License-Identifier: FSL-1.1-ALv2
name: start-failures
description: >-
  VMs launched during the first 10 minutes never register (broken boot). Each is failed after startupTimeout,
  drained, terminated and replaced with backoff; once the fault clears, the replacements register and all work
  completes (R-SCALE-2). Cost stays bounded: no runaway relaunching.
seed: 4
duration: 30m
fleet:
  pools:
    - name: linux-x86-64
      provider: ec2
      platform: linux-x86-64
      runners:
        - name: native
          properties: {OSFamily: linux, ISA: x86-64}
          concurrency: 8
      vcpus: 8
      max: 4
      idleTimeout: 5m
      startupTimeout: 5m
      instanceTypes: [c8i.2xlarge, c7i.2xlarge]
      subnets: [subnet-a, subnet-b]
workload:
  arrivals:
    - {at: 30s, pool: linux-x86-64, count: 40, duration: 30s}
faults:
  - {at: 0s, kind: start-failure, pool: linux-x86-64, duration: 10m}
expectations:
  allSucceed: true
  endAtZero: true
  maxInstances: {linux-x86-64: 4}
  maxLaunches: {linux-x86-64: 9}
  queueWaitMax: 12m
