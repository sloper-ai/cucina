# SPDX-License-Identifier: FSL-1.1-ALv2
name: oscillation
description: >-
  Demand oscillates with a 4-minute period (shorter than idleTimeout): 60 actions arrive, then nothing. Scale-in
  happens only through per-VM idle timers with empty queues, so no VM is stopped while the oscillation lasts and
  every VM is launched exactly once (no flapping, R-SCALE-3).
seed: 3
duration: 1h
fleet:
  pools:
    - name: linux-x86-64
      provider: ec2
      platform: linux-x86-64
      runners:
        - name: native
          properties: {OSFamily: linux, ISA: x86-64}
          concurrency: 8
      vcpus: 8
      max: 4
      idleTimeout: 5m
      startupTimeout: 5m
      instanceTypes: [c8i.2xlarge, c7i.2xlarge]
      subnets: [subnet-a, subnet-b]
workload:
  arrivals:
    - {at: 0m, pool: linux-x86-64, count: 60, duration: 25s}
    - {at: 4m, pool: linux-x86-64, count: 60, duration: 25s}
    - {at: 8m, pool: linux-x86-64, count: 60, duration: 25s}
    - {at: 12m, pool: linux-x86-64, count: 60, duration: 25s}
    - {at: 16m, pool: linux-x86-64, count: 60, duration: 25s}
    - {at: 20m, pool: linux-x86-64, count: 60, duration: 25s}
    - {at: 24m, pool: linux-x86-64, count: 60, duration: 25s}
    - {at: 28m, pool: linux-x86-64, count: 60, duration: 25s}
    - {at: 32m, pool: linux-x86-64, count: 60, duration: 25s}
    - {at: 36m, pool: linux-x86-64, count: 60, duration: 25s}
    - {at: 40m, pool: linux-x86-64, count: 60, duration: 25s}
    - {at: 44m, pool: linux-x86-64, count: 60, duration: 25s}
    - {at: 48m, pool: linux-x86-64, count: 60, duration: 25s}
    - {at: 52m, pool: linux-x86-64, count: 60, duration: 25s}
    - {at: 56m, pool: linux-x86-64, count: 60, duration: 25s}
expectations:
  allSucceed: true
  endAtZero: true
  maxLaunches: {linux-x86-64: 4}
  queueWaitMax: 3m
