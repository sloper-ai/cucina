# SPDX-License-Identifier: FSL-1.1-ALv2
name: ice
description: >-
  The preferred instance type has no capacity for 20 minutes, and for 4 of them no type has any. Launches fall
  through to the next type, ICE'd types move to the end of the preference list (rotation), full ICE backs off
  with jitter, and all work completes once capacity returns (R-POOL-2, R-SCALE-4).
seed: 6
duration: 40m
fleet:
  pools:
    - name: linux-x86-64
      provider: ec2
      platform: linux-x86-64
      runners:
        - name: native
          properties: {OSFamily: linux, ISA: x86-64}
          concurrency: 8
      vcpus: 8
      max: 4
      idleTimeout: 5m
      startupTimeout: 5m
      instanceTypes: [c8i.2xlarge, c7i.2xlarge]
      subnets: [subnet-a, subnet-b]
workload:
  arrivals:
    - {at: 30s, pool: linux-x86-64, count: 200, duration: 20s}
    - {at: 12m, pool: linux-x86-64, count: 200, duration: 20s}
faults:
  - {at: 0s, kind: ice, type: c8i.2xlarge, duration: 20m}
  - {at: 11m, kind: ice, pool: linux-x86-64, duration: 4m}
expectations:
  allSucceed: true
  endAtZero: true
  maxInstances: {linux-x86-64: 4}
  maxLaunches: {linux-x86-64: 8}
  queueWaitMax: 9m
