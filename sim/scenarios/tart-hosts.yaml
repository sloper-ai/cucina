# SPDX-License-Identifier: FSL-1.1-ALv2
name: tart-hosts
description: >-
  A macOS pool on two Mac hosts (2 VMs each). VMs spread one per host before a second (R-POOL-6), never more
  than two run on a host (R-MAC-3), a host that drops offline for 3 minutes loses its workers and their actions
  are retried elsewhere (R-MAC-6), and idle VMs are stopped (disk kept). A second build later restarts the stopped VMs
  (warm L1) and their stale drains are removed when they start again (R-SCALE-3 step 4).
seed: 12
duration: 50m
fleet:
  hosts:
    - {serial: MINI0001, slots: 2}
    - {serial: MINI0002, slots: 2}
  pools:
    - name: macos-arm64-xcode27.0
      provider: tart
      platform: macos-arm64-xcode27.0
      runners:
        - name: xcode
          properties: {OSFamily: macos, ISA: arm-a64, xcode-version: "27.0"}
          concurrency: 4
        - name: generic
          properties: {OSFamily: macos, ISA: arm-a64}
          concurrency: 4
      vcpus: 4
      max: 4
      idleTimeout: 10m
      startupTimeout: 5m
      vmsPerHost: 2
workload:
  arrivals:
    - {at: 30s, pool: macos-arm64-xcode27.0, runner: xcode, count: 150, duration: 30s}
    - {at: 30s, pool: macos-arm64-xcode27.0, runner: generic, count: 50, duration: 20s}
    - {at: 35m, pool: macos-arm64-xcode27.0, runner: xcode, count: 100, duration: 30s}
faults:
  - {at: 4m, kind: host-offline, host: MINI0002, duration: 3m}
expectations:
  allSucceed: true
  endAtZero: true
  maxInstances: {macos-arm64-xcode27.0: 4}
