# SPDX-License-Identifier: FSL-1.1-ALv2
name: daily-cap
description: >-
  A pool with a daily instance-hour cap of 0.2 h (R-SCALE-7). The first build launches the pool and finishes on the
  running VMs; once the cap is consumed no new instance is launched, and a later build is failed fast with a clear
  message instead of hanging (R-RE-2).
seed: 16
duration: 20m
fleet:
  pools:
    - name: linux-x86-64
      provider: ec2
      platform: linux-x86-64
      runners:
        - name: native
          properties: {OSFamily: linux, ISA: x86-64}
          concurrency: 8
      vcpus: 8
      max: 4
      idleTimeout: 5m
      startupTimeout: 5m
      instanceTypes: [c8i.2xlarge, c7i.2xlarge]
      dailyInstanceHourCap: 0.2
workload:
  arrivals:
    - {at: 30s, pool: linux-x86-64, count: 100, duration: 20s}
    - {at: 15m, pool: linux-x86-64, count: 10, duration: 20s}
expectations:
  minFailed: 10
  maxFailWait: 3s
  maxLaunches: {linux-x86-64: 4}
  endAtZero: true
