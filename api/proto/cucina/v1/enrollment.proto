syntax = "proto3";

package cucina.v1;

import "cucina/v1/common.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/sloper-ai/cucina/api/proto/cucina/v1;cucinav1";

// EnrollmentService is served by the controller on the worker endpoint
// (TLS server authentication with a certificate from Cucina's CA; client
// certificates are NOT required because the callers have none yet). Callers
// authenticate through the request itself:
//   - EC2 workers: the AWS-signed instance identity document (R-SEC-3), verified
//     against the AWS public certificate and cross-checked with a tag-filtered
//     DescribeInstances call (pool tags, instance state, launch age).
//   - Mac hosts: a multi-use site enrollment token + serial number + CSR. The
//     controller admits only pre-registered or approved serial numbers.
// No long-lived secret is baked into any image or package (R-SEC-3, UC23).
service EnrollmentService {
  // EnrollWorker is called at EVERY boot of an EC2 worker by `cucina-worker-agent bootstrap`.
  rpc EnrollWorker(EnrollWorkerRequest) returns (EnrollWorkerResponse);
  // EnrollHost is called by cucina-hostd on first start (and re-polled while PENDING).
  rpc EnrollHost(EnrollHostRequest) returns (EnrollHostResponse);
}

message EnrollWorkerRequest {
  ProtocolVersion protocol = 1;
  // Raw JSON of http://169.254.169.254/latest/dynamic/instance-identity/document.
  bytes instance_identity_document = 2;
  // Base64 RSA-2048 signature: the body of …/instance-identity/rsa2048 (NOT /signature, which is
  // RSA-1024) — the controller verifies it against the AWS regional certificate over the document.
  string signature = 3;
  // PEM PKCS#10 CSR for a key the agent generated at boot (the key never leaves the instance).
  bytes csr_pem = 4;
  string agent_version = 5;
  string os = 6;   // linux | windows
  string arch = 7; // x86_64 | arm64
}

message EnrollWorkerResponse {
  // PEM leaf certificate (URI SAN spiffe://cucina/worker/<pool>/<instance-id>), <= 7 days.
  bytes certificate_pem = 1;
  // PEM CA bundle (Cucina CA, possibly two during rotation).
  bytes ca_pem = 2;
  google.protobuf.Timestamp expires_at = 3;
  string pool = 4;
  string generation = 5;
  WorkerSettings settings = 6;
}

// WorkerSettings are the pool-level inputs of internal/bbconfig.RenderWorker /
// RenderRunner. The agent (EC2) or hostd (Tart) adds the machine-dependent parts
// (instance-store path, vCPUs, memory, paths) and writes the final configuration files.
message WorkerSettings {
  string pool = 1;
  string node = 2; // EC2 instance ID or "<host>/<vm>" — the `node` worker-id label
  repeated RunnerSettings runners = 3;
  // Where to connect.
  string scheduler_endpoint = 4; // host:port of the scheduler worker API (via the worker endpoint)
  string storage_endpoint = 5;   // host:port of the frontend worker listener (CAS/AC); Mac VMs: hostd L2
  string server_name = 6;        // TLS server name to verify
  // Build directory and cache.
  string build_directory = 7;    // fuse | winfsp | nfsv4 | native
  string l1_placement = 8;       // instance-store | ebs | memory | vm-disk | auto
  uint64 l1_size_bytes = 9;      // 0 = derive from the machine
  uint64 maximum_message_size_bytes = 10;
  bool wan_compression = 11;     // zstd encoderLevel 3 on the hop to the central endpoint (Mac sites)
  uint32 size_class = 12;
  repeated string instance_name_prefixes = 13;
  // Dead-man switch (R-POOL-7).
  DeadmanSettings deadman = 14;
  // Metrics: Prometheus HTTP-SD is served by the controller; workers expose bb_worker /metrics
  // on this port (allowed from the cluster SG). Mac VMs push via hostd.
  uint32 metrics_port = 15;
  string pushgateway_url = 16;
  // Free-form extra environment for the services (for example proxies); never secrets.
  map<string, string> env = 17;
  // Spot interruption handling: SIGTERM bb_worker on the 2-minute notice (R-POOL-2 SHOULD).
  bool handle_spot_interruption = 18;
}

message RunnerSettings {
  string name = 1; // native | qemu-rv64g | xcode | generic | …
  repeated PlatformProperty platform = 2; // exact REAPI property set
  uint32 concurrency = 3;                 // 0 = derive (vCPUs)
  string emulator = 4;                    // e.g. "qemu-riscv64" for emulated runners
}

message DeadmanSettings {
  google.protobuf.Duration idle_limit = 1;        // default 30m
  google.protobuf.Duration unreachable_limit = 2; // default 10m
  google.protobuf.Duration max_uptime = 3;        // default 12h
}

message EnrollHostRequest {
  ProtocolVersion protocol = 1;
  string site_token = 2;   // the multi-use site enrollment token (never logged)
  string serial_number = 3;
  string hostname = 4;
  bytes csr_pem = 5;       // key generated by hostd, kept in the System keychain
  HostFacts facts = 6;
}

message EnrollHostResponse {
  enum Status {
    STATUS_UNSPECIFIED = 0;
    STATUS_PENDING = 1;       // serial unknown/unapproved: poll again after retry_after
    STATUS_APPROVED = 2;      // certificate issued
    STATUS_DENIED = 3;        // serial revoked or re-enrollment of an existing serial (needs an admin)
    STATUS_TOKEN_INVALID = 4; // expired, revoked, wrong site, or max hosts reached
  }
  Status status = 1;
  string message = 2;
  bytes certificate_pem = 3; // URI SAN spiffe://cucina/host/<serial>
  bytes ca_pem = 4;
  google.protobuf.Timestamp expires_at = 5;
  google.protobuf.Duration retry_after = 6;
  string host_endpoint = 7; // address of HostService (mTLS)
}

// HostFacts are reported at enrollment and at every Connect (R-MAC-5).
message HostFacts {
  string model = 1;
  string chip = 2;
  uint32 cores = 3;
  uint32 memory_gib = 4;
  uint32 disk_free_gib = 5;
  string macos_version = 6;
  string tart_version = 7;
  string agent_version = 8;
  string filevault = 9; // "off" | "on" | "unknown"
  string site = 10;
  map<string, string> labels = 11;
}
