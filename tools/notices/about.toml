# SPDX-License-Identifier: FSL-1.1-ALv2
#
# cargo-about configuration for tools/notices/generate.sh (cargo-about 0.9.2).
# `accepted` mirrors the licence allow-list in deny.toml and policy.json: a crate
# whose licence expression cannot be satisfied from this list fails the run.
accepted = [
    "Apache-2.0",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "0BSD",
    "Unlicense",
    "CC0-1.0",
    "Zlib",
    "BSL-1.0",
    "OpenSSL",
    "Unicode-3.0",
]

# Only what is linked into the release binaries counts.
ignore-build-dependencies = true
ignore-dev-dependencies = true

# The release targets of cucinactl.
targets = [
    "aarch64-apple-darwin",
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
    "x86_64-pc-windows-gnullvm",
]

# Cucina's own crates (publish = false) are covered by LICENSE.md, not listed here.
[private]
ignore = true
