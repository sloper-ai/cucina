# SPDX-License-Identifier: FSL-1.1-ALv2
# CI on GitHub-hosted runners (§9, R-BUILD-6): lint + secret scan, `bazel test //...`
# on Linux, macOS and Windows (each OS runs the targets compatible with it via
# target_compatible_with), and an RBE job through Cucina itself once the repository
# variable CUCINA_ENDPOINT is set. Nightly: quarantined tests and the simulation tier.
#
# Repository policy: only GitHub-owned actions and an allow-list (jdx/mise-action, ...)
# may run, each pinned to a full commit SHA. Bazelisk and every other tool come from
# mise (versions from mise.toml); Bazel's caches are kept with actions/cache.
name: ci

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  merge_group:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: lint + secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # exact PR commits and Buf's immutable comparison tree
          persist-credentials: false
      - name: verify change range and enforce Test-Change on every PR commit
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          EVENT_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          CHECKOUT_SHA: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          test "$(git rev-parse HEAD)" = "$CHECKOUT_SHA"
          base="$EVENT_BASE"
          case "$base" in
            ''|0000000000000000000000000000000000000000)
              # New branches, schedules and dispatches compare to the fetched default
              # branch snapshot. Never turn an unavailable baseline into a skipped gate.
              git check-ref-format "refs/heads/$DEFAULT_BRANCH"
              base="$(git rev-parse --verify "refs/remotes/origin/${DEFAULT_BRANCH}^{commit}")"
              ;;
          esac
          args=("$base" "$EVENT_HEAD")
          if [ "$EVENT" = pull_request ]; then args+=(--check-tests); fi
          tools/ci/change-context.sh "${args[@]}" >> "$GITHUB_OUTPUT"
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          install_args: go rust golangci-lint gitleaks aqua:EmbarkStudios/cargo-deny actionlint shellcheck buf opentofu tflint
      - name: gitleaks (full history, §12)
        run: gitleaks git --no-banner --redact --config .gitleaks.toml --exit-code 1 .
      - name: golangci-lint
        run: golangci-lint run ./...
      - name: cargo-deny
        run: cargo-deny --all-features check
      - name: actionlint
        run: actionlint
      - name: Buf breaking compatibility (immutable baseline)
        env:
          BASE_SHA: ${{ steps.changes.outputs.base }}
        run: buf breaking --against ".git#ref=${BASE_SHA}" --error-format=github-actions
      - name: offline OpenTofu, tflint and infrastructure policy
        env:
          E2E_TESTS_SKIP: ""
          AWS_SHARED_CREDENTIALS_FILE: ${{ runner.temp }}/no-aws-credentials
          AWS_CONFIG_FILE: ${{ runner.temp }}/no-aws-config
        run: deploy/aws-e2e/tests/run.sh

  test:
    name: bazel test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    defaults:
      run:
        shell: bash
    steps:
      - name: free disk space (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - name: short hostname for Kubernetes identity leases (macOS)
        if: runner.os == 'macOS'
        # The hosted VM name can exceed the 63-byte Kubernetes label limit.
        # The pinned API server copies os.Hostname() into its identity Lease;
        # rejected leases stall shutdown. Keep the full control plane and timeout.
        run: |
          if [ "${GITHUB_ACTIONS:-}" != true ] || [ "${RUNNER_OS:-}" != macOS ] || [ "${RUNNER_ENVIRONMENT:-}" != github-hosted ]; then
            printf '%s\n' 'Hostname setup requires a disposable GitHub-hosted macOS runner.' >&2
            exit 2
          fi
          sudo /bin/hostname cucina-ci
          test "$(hostname)" = cucina-ci
      - name: long paths (Windows)
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          install_args: bazelisk
      - name: configure Bazel caches (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          {
            echo "common --repository_cache=${HOME}/.cache/bazel-repo"
            # Extracted repositories stay out of the saved cache (they're large).
            echo "common --repo_contents_cache=${HOME}/.cache/bazel-repo-contents"
            echo "build --disk_cache=${HOME}/.cache/bazel-disk"
            echo "build --experimental_disk_cache_gc_max_size=4G"
          } > user.bazelrc
          cat user.bazelrc
      - name: configure Bazel storage (Windows)
        id: windows-storage
        if: runner.os == 'Windows'
        shell: pwsh
        # The disk-cache GC limit applies only while idle, not during a build.
        # A single-workspace runner needs one output tree, not a second copy of
        # every action output. Keep only the reusable repository downloads.
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_ACTIONS -ne 'true' -or $env:RUNNER_OS -ne 'Windows' -or $env:RUNNER_ENVIRONMENT -ne 'github-hosted') {
            throw 'Bazel storage setup requires a disposable GitHub-hosted Windows runner.'
          }
          $workspaceDrive = Split-Path -Qualifier $env:GITHUB_WORKSPACE
          $allowedDrives = @($env:SystemDrive, $workspaceDrive) | Sort-Object -Unique
          if (@($allowedDrives | Where-Object { $_ -notmatch '^[A-Z]:$' }).Count -ne 0) {
            throw 'Expected drive-letter roots for the hosted system and workspace.'
          }
          $volumes = @(Get-CimInstance Win32_LogicalDisk -Filter 'DriveType=3' |
            Where-Object { $_.DeviceID -in $allowedDrives -and $_.FreeSpace -gt 0 })
          if ($volumes.Count -eq 0) { throw 'No writable fixed system/workspace volume was found.' }
          $volumes | Select-Object DeviceID, Size, FreeSpace | Format-Table -AutoSize
          $chosen = $volumes | Sort-Object @{ Expression = 'FreeSpace'; Descending = $true }, DeviceID | Select-Object -First 1
          $root = "$($chosen.DeviceID)/b"
          # Never delete preinstalled tools or an earlier caller's directory.
          if (Test-Path -LiteralPath $root) { throw "Refusing to reuse unexpected storage directory $root" }
          New-Item -ItemType Directory -Path "$root/o", "$root/r" | Out-Null
          @(
            "startup --output_user_root=$root/o"
            "common --repository_cache=$root/r"
            'common --experimental_repository_cache_hardlinks'
            'common --repo_contents_cache='
            'build --disk_cache='
          ) | Set-Content -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'user.bazelrc') -Encoding utf8
          "repository-cache=$root/r" >> $env:GITHUB_OUTPUT
          "CUCINA_CI_BAZEL_ROOT=$root" >> $env:GITHUB_ENV
          Write-Host "Bazel storage: $root; initial free bytes: $($chosen.FreeSpace)"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: runner.os != 'Windows'
        with:
          path: |
            ~/.cache/bazel-repo
            ~/.cache/bazel-disk
          key: bazel-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.bazelversion', 'MODULE.bazel.lock', 'go.sum', 'Cargo.lock') }}
          restore-keys: |
            bazel-${{ runner.os }}-${{ runner.arch }}-
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: windows-repositories
        if: runner.os == 'Windows'
        with:
          path: ${{ steps.windows-storage.outputs.repository-cache }}
          # Never restore the old combined repository/action cache onto the new root.
          key: bazel-repo-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.bazelversion', 'MODULE.bazel.lock', 'go.sum', 'Cargo.lock') }}
          restore-keys: |
            bazel-repo-v2-${{ runner.os }}-${{ runner.arch }}-
      - name: record free space after cache restore (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_ACTIONS -ne 'true' -or $env:RUNNER_OS -ne 'Windows' -or $env:RUNNER_ENVIRONMENT -ne 'github-hosted') {
            throw 'Storage diagnostics require a disposable GitHub-hosted Windows runner.'
          }
          Write-Host "Bazel storage: $env:CUCINA_CI_BAZEL_ROOT"
          Get-CimInstance Win32_LogicalDisk -Filter 'DriveType=3' |
            Select-Object DeviceID, Size, FreeSpace | Format-Table -AutoSize
      - name: native portability checks (Windows)
        id: windows-portability
        if: runner.os == 'Windows'
        # Fail at the affected native boundaries before building unrelated release
        # artifacts. Passing this subset never replaces the full canonical gates.
        run: |
          bazelisk test --config=ci --test_output=errors -- \
            //charts/cucina/tests/boot:boot_test \
            //cli/cucinactl:tui_pty_test \
            //internal/bbconfig/boottest:boottest_test \
            //internal/envtest/internal/testing/process:process_test \
            //internal/workeragent/integration:integration_test \
            //test/e2e/bazelrun:windows_wait_test \
            //test/e2e/remote:windows_ownership_test \
            //tools/envtest:envtest_test
      - name: bazel build
        run: bazelisk build --config=ci -- //...
      - name: bazel test
        id: tests
        # Keep the full Windows suite uncached and repeat native boundaries:
        # macOS repetitions cannot qualify Windows-only branches. A single failed
        # repetition must fail the gate, not become a passing FLAKY aggregate.
        run: |
          if [ "${RUNNER_OS}" = Windows ]; then
            repetitions=()
            for target in \
              //charts/cucina/tests/boot:boot_test \
              //cli/cucinactl:tui_pty_test \
              //internal/bbconfig/boottest:boottest_test \
              //internal/bbtest:bbtest_test \
              //internal/envtest/internal/testing/process:process_test \
              //internal/workeragent/integration:integration_test \
              //test/e2e/bazelrun:windows_wait_test \
              //test/e2e/remote:windows_ownership_test \
              //tools/envtest:envtest_test; do
              repetitions+=("--runs_per_test=^${target}\$@20")
            done
            bazelisk test --config=ci --nocache_test_results \
              --noruns_per_test_detects_flakes "${repetitions[@]}" -- //...
          else
            bazelisk test --config=ci -- //...
          fi
      - name: chart boot timeout diagnostics (Windows)
        if: failure() && runner.os == 'Windows' && (steps.tests.outcome == 'failure' || steps.windows-portability.outcome == 'failure')
        # Dump Go stacks before the unchanged 60-second Bazel deadline. This
        # diagnostic never replaces the full suite or clears its failed result.
        run: |
          bazelisk test --config=ci --nocache_test_results --test_output=all \
            --test_arg=-test.v --test_arg=-test.timeout=50s \
            --test_env=GOTRACEBACK=all -- //charts/cucina/tests/boot:boot_test
      - name: clippy (warnings are errors)
        if: runner.os == 'Linux'
        run: bazelisk build --config=ci --config=clippy -- //cli/...
      - name: cross-build Rust release targets (Linux musl, Windows gnullvm)
        if: runner.os == 'Linux'
        run: |
          for triple in x86_64-unknown-linux-musl aarch64-unknown-linux-musl x86_64-pc-windows-gnullvm; do
            bazelisk build --config=ci --platforms="@rules_rs//rs/platforms:${triple}" //cli/cucinactl //tools/hello/rust:hello_rs
          done
      - name: retain repository downloads after failed tests (Windows)
        if: >-
          !cancelled() && runner.os == 'Windows' &&
          steps.windows-repositories.outcome == 'success' &&
          steps.windows-repositories.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Content-addressed downloads only: no action outputs or test results.
          path: ${{ steps.windows-storage.outputs.repository-cache }}
          key: ${{ steps.windows-repositories.outputs.cache-primary-key }}
      - name: record final storage usage (Windows)
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_ACTIONS -ne 'true' -or $env:RUNNER_OS -ne 'Windows' -or $env:RUNNER_ENVIRONMENT -ne 'github-hosted') {
            throw 'Storage diagnostics require a disposable GitHub-hosted Windows runner.'
          }
          Get-CimInstance Win32_LogicalDisk -Filter 'DriveType=3' |
            Select-Object DeviceID, Size, FreeSpace | Format-Table -AutoSize
          if ($env:CUCINA_CI_BAZEL_ROOT) {
            if ($env:CUCINA_CI_BAZEL_ROOT -notmatch '^[A-Z]:/b$') { throw 'Unexpected Bazel storage root.' }
            foreach ($directory in @('o', 'r')) {
              $path = "$env:CUCINA_CI_BAZEL_ROOT/$directory"
              # Logical file bytes, not allocated blocks; do not follow directory links.
              $bytes = (Get-ChildItem -LiteralPath $path -File -Recurse -Force -ErrorAction SilentlyContinue |
                Measure-Object -Property Length -Sum).Sum
              Write-Host "$path logical file bytes: $bytes"
            }
          }

  nightly:
    name: nightly (quarantine + simulation)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          install_args: bazelisk
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/bazel-repo
            ~/.cache/bazel-disk
          key: bazel-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.bazelversion', 'MODULE.bazel.lock', 'go.sum', 'Cargo.lock') }}
          restore-keys: |
            bazel-${{ runner.os }}-${{ runner.arch }}-
      - name: quarantined + simulation-tier tests
        run: |
          printf 'common --repository_cache=%s\nbuild --disk_cache=%s\n' "${HOME}/.cache/bazel-repo" "${HOME}/.cache/bazel-disk" > user.bazelrc
          targets="$(bazelisk query --noshow_progress \
            'attr(tags, "\bquarantine\b", tests(//...)) + attr(tags, "\btier-simulation\b", tests(//...))')"
          if [ -z "${targets}" ]; then
            echo "no quarantined or simulation tests"
            exit 0
          fi
          # shellcheck disable=SC2086 # one target per word
          bazelisk test --config=ci --config=nightly ${targets}

  rbe:
    name: bazel test via Cucina RBE
    # Only trusted pushes/dispatches receive an OIDC token; never PR or merge-queue code.
    if: vars.CUCINA_ENDPOINT != '' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write # GitHub OIDC -> Cucina STS (R-AUTH-7)
    env:
      # Optional when STS discovery is not at https://<remote-executor-host>.
      CUCINA_URL: ${{ vars.CUCINA_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          install_args: bazelisk
      - name: build the credential helper locally (no remote bootstrap dependency)
        run: |
          bazelisk build --config=ci //cli/cucinactl
          bin="${RUNNER_TEMP}/cucina-bin"
          mkdir -p "${bin}"
          install -m 0755 bazel-bin/cli/cucinactl/cucinactl "${bin}/cucinactl"
          "${bin}/cucinactl" credential-helper install --dir "${bin}"
      - name: configure Cucina remote execution
        env:
          CUCINA_ENDPOINT: ${{ vars.CUCINA_ENDPOINT }}
        # The helper gets fresh GitHub OIDC credentials from the client environment;
        # no bearer token, login cache or GitHub token is written into the rc file.
        run: |
          endpoint="${CUCINA_ENDPOINT#grpcs://}"
          case "${endpoint}" in
            ''|*/*|*@*|*\[*|*\]*|*[[:space:]]*)
              echo 'CUCINA_ENDPOINT must be a TLS hostname[:port], optionally prefixed by grpcs://' >&2
              exit 1
              ;;
          esac
          host="${endpoint%%:*}"
          {
            echo "build:cucina --remote_executor=grpcs://${endpoint}"
            echo "build:cucina --credential_helper=${host}=${RUNNER_TEMP}/cucina-bin/cucina-credential-helper"
            echo 'build:cucina --platforms=@cucina_platforms//exec:linux-x86-64-native'
          } >> user.bazelrc
      - name: bazel test //... (remote)
        run: bazelisk test --config=ci --config=cucina-ci //...
