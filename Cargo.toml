# SPDX-License-Identifier: FSL-1.1-ALv2
# Cargo workspace for the Rust code (cucinactl, R-CLI). Cargo.toml/Cargo.lock are
# the source of truth for Rust dependencies; Bazel reads them through rules_rs
# (`crate.from_cargo` in MODULE.bazel). After changing dependencies run
# `cargo update -p <crate>` (or `cargo generate-lockfile`) and rebuild with Bazel;
# see docs/dev/bazel.md. Versions follow R-LIB-3.
[workspace]
resolver = "3"
members = ["cli/cucinactl", "cli/xtask"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
license = "FSL-1.1-ALv2"
repository = "https://github.com/sloper-ai/cucina"
publish = false

[workspace.dependencies]
# CLI + completions
clap = { version = "4.6.7", features = ["derive", "env"] }
clap_complete = "4.6.11"
# TUI (crossterm 0.29 via ratatui::crossterm)
ratatui = "0.30.2"
# Async
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "sync", "fs", "io-util", "process"] }
tokio-stream = "0.1.19"
futures = "0.3.34"
# RPC / protobuf: connect-rust + buffa (ADR 0003). Code is generated by the pinned
# protoc plugins (Bazel: cucina_proto_rust; Cargo: buf generate) and checked in.
buffa = { version = "=0.9.2", features = ["json"] }
buffa-types = { version = "=0.9.2", features = ["json"] }
connectrpc = "=0.9.1"
# TLS: one crypto provider, aws-lc-rs, everywhere. Never enable `ring` features.
# aws-lc-rs/aws-lc-sys are built from the rules_rs BCR overlay (third_party/rust).
rustls = "0.23.45"
tokio-rustls = "0.26.6"
rustls-pki-types = "1.15"
rustls-platform-verifier = "0.7.1"
aws-lc-rs = "1.18.1"
# HTTP / OIDC / JWT
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2", "json", "form", "system-proxy"] }
openidconnect = { version = "4.0.1", default-features = false }
oauth2 = { version = "5.0.0", default-features = false }
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["aws_lc_rs", "use_pem"] }
axum = { version = "0.8.9", default-features = false, features = ["tokio", "http1", "query"] }
webbrowser = { version = "1.2.4", features = ["hardened"] }
keyring = "4.2.0"
# Config / serialization (JSON and TOML only; no YAML in Rust)
toml = "1.1.6"
dirs = "7.0.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# Errors / logging (tracing to stderr)
anyhow = "1.0.104"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
# Output
comfy-table = "8.0.1"
indicatif = "0.18.6"
anstream = "1"
anstyle = "1"
# Time / hashing / compression
jiff = "0.2.37"
sha2 = "0.11.0"
zstd = "0.14.0"
base64 = "0.22"
# Tests
insta = "1.48.0"
proptest = "1.11.0"
proptest-state-machine = "0.8.0"
assert_cmd = "2.2.2"
predicates = "3"
rexpect = "0.7.1"
expectrl = "0.9.0"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
print_stderr = "allow"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
