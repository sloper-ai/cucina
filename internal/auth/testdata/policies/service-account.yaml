# SPDX-License-Identifier: FSL-1.1-ALv2
# Opt-in service account for a system without OIDC (R-AUTH-10). Keys are created with
# `cucinactl keys create nightly-cache`, stored hashed, exchanged at the STS like any other
# subject token (the principal is `sa:nightly-cache`) and revocable at once.
apiVersion: cucina.sloper.ai/v1alpha1
kind: TrustPolicy
metadata:
  name: sa-nightly-cache
  namespace: cucina
spec:
  type: serviceAccount
  serviceAccount:
    name: nightly-cache
  grants:
    - name: cache-warmer
      instanceNames: [main]
      verbs: [cas-read, cas-write, ac-read, ac-write]
      maxTTL: 10m
