---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cucina.scheduler.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cucina.labels" (dict "ctx" . "component" "scheduler") | nindent 4 }}
data:
  scheduler.jsonnet: |
    {{- include "cucina.scheduler.config" . | nindent 4 }}
