{{/*
PrometheusRule (R-OBS-2/-3): the ported Buildbarn recording rules
(files/rules/buildbarn-recording.yaml), Cucina's recording rules and UC16 alerts
(files/rules/cucina.yaml, thresholds from values) and the Sloth-generated SLO
burn-rate rules (files/rules/slo.yaml from files/slo/*.yaml).
*/}}
{{- if .Values.monitoring.prometheusRules.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "cucina.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cucina.labels" (dict "ctx" . "component" "monitoring") | nindent 4 }}
    {{- with .Values.monitoring.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- include "cucina.rules" . | nindent 2 }}
{{- end }}
