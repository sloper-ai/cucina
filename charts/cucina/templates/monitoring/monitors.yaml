{{/*
Prometheus Operator scrape objects (R-OBS-1). Buildbarn targets get the labels the
ported bb-deployments recording rules aggregate by (kubernetes_service, kubernetes_shard,
kubernetes_replica) plus cucina_buildbarn/cucina_component. EC2 workers and Mac host/VM
metrics are discovered through the leader's /sd/workers and /sd/hosts, respectively.
*/}}
{{- $m := .Values.monitoring -}}
{{- if $m.serviceMonitors.enabled }}
{{- $components := list
  (dict "component" "frontend" "port" "diagnostics" "buildbarn" true)
  (dict "component" "storage" "port" "diagnostics" "buildbarn" true)
  (dict "component" "scheduler" "port" "diagnostics" "buildbarn" true)
  (dict "component" "controller" "port" "metrics" "buildbarn" false)
  (dict "component" "sts" "port" "metrics" "buildbarn" false) -}}
{{- if $m.pushgateway.enabled }}
{{- $components = append $components (dict "component" "pushgateway" "port" "http" "buildbarn" true "honorLabels" true) -}}
{{- end }}
{{- range $components }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "cucina.fullname" $ }}-{{ .component }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "cucina.labels" (dict "ctx" $ "component" .component) | nindent 4 }}
    {{- with $m.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "cucina.selectorLabels" (dict "ctx" $ "component" .component) | nindent 6 }}
    matchExpressions:
      # Only component Services: exclude exposure and leader-discovery Services
      # to avoid scraping the same process twice.
      - key: cucina.sloper.ai/endpoint
        operator: DoesNotExist
  namespaceSelector:
    matchNames: [{{ $.Release.Namespace }}]
  endpoints:
    - port: {{ .port }}
      path: /metrics
      interval: {{ $m.serviceMonitors.interval }}
      {{- if .honorLabels }}
      honorLabels: true
      {{- end }}
      relabelings:
        - targetLabel: cucina_component
          replacement: {{ .component }}
        {{- if .buildbarn }}
        - targetLabel: cucina_buildbarn
          replacement: "true"
        - sourceLabels: [__meta_kubernetes_service_name]
          targetLabel: kubernetes_service
        {{- end }}
        {{- if eq .component "storage" }}
        - sourceLabels: [__meta_kubernetes_pod_label_apps_kubernetes_io_pod_index]
          targetLabel: kubernetes_shard
        - targetLabel: kubernetes_replica
          replacement: "0"
        {{- end }}
{{- end }}
{{- end }}
{{- if $m.workerScrapeConfig.enabled }}
---
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: {{ include "cucina.fullname" . }}-workers
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cucina.labels" (dict "ctx" . "component" "worker") | nindent 4 }}
    {{- with $m.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  httpSDConfigs:
    - url: {{ printf "http://%s:9090/sd/workers" (include "cucina.fqdn" (list . (include "cucina.controllerLeader.name" .))) }}
      refreshInterval: {{ $m.workerScrapeConfig.refreshInterval }}
  metricsPath: /metrics
  relabelings:
    - targetLabel: namespace
      replacement: {{ .Release.Namespace }}
    - targetLabel: cucina_component
      replacement: worker
    - targetLabel: cucina_buildbarn
      replacement: "true"
    - sourceLabels: [pool]
      targetLabel: kubernetes_service
      replacement: worker-$1
---
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: {{ include "cucina.fullname" . }}-hosts
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cucina.labels" (dict "ctx" . "component" "hostd") | nindent 4 }}
    {{- with $m.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  httpSDConfigs:
    - url: {{ printf "http://%s:9090/sd/hosts" (include "cucina.fqdn" (list . (include "cucina.controllerLeader.name" .))) }}
      refreshInterval: {{ $m.workerScrapeConfig.refreshInterval }}
  # Discovery returns the owning Pod address, a separate __metrics_path__ for
  # each hostd/L2/worker source, and trusted namespace/serial/pool/node/component
  # labels. Never replace them or let scraped payload labels override them.
  honorLabels: false
  relabelings:
    - sourceLabels: [cucina_component]
      regex: (worker|host-l2)
      targetLabel: cucina_buildbarn
      replacement: "true"
    - sourceLabels: [cucina_component, pool]
      regex: worker;(.+)
      targetLabel: kubernetes_service
      replacement: worker-$1
    - sourceLabels: [cucina_component]
      regex: host-l2
      targetLabel: kubernetes_service
      replacement: host-l2
{{- end }}
