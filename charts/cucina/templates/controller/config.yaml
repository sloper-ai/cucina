---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cucina.controller.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cucina.labels" (dict "ctx" . "component" "controller") | nindent 4 }}
data:
  controller.json: |
    {{- include "cucina.controller.config" . | nindent 4 }}
  platforms.json: |
    {{- include "cucina.catalog" . | fromJson | toPrettyJson | nindent 4 }}
  certs.json: |
    {{- include "cucina.certsFile" . | nindent 4 }}
