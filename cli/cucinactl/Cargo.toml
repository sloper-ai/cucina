# SPDX-License-Identifier: FSL-1.1-ALv2
# cucinactl: Cucina management CLI (+ TUI, credential helper, bazelrc generator).
# The workspace plumbing (root Cargo.toml/Cargo.lock, MODULE.bazel crate config,
# third_party/rust) belongs to the bazel agent; this crate is owned by the CLI.
# Dependencies follow R-LIB-3 exactly; additions are recorded in docs/adr/08xx.
[package]
name = "cucinactl"
description = "Cucina management CLI and TUI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "cucinactl"
path = "src/lib.rs"

# `cucina-credential-helper` is the same binary (hardlink/copy) dispatched on argv[0].
[[bin]]
name = "cucinactl"
path = "src/main.rs"

[dependencies]
anstream.workspace = true
anstyle.workspace = true
anyhow.workspace = true
axum.workspace = true
base64.workspace = true
# Protobuf runtime of the generated code (ADR 0003).
buffa = { version = "=0.9.2", features = ["json"] }
buffa-types = { version = "=0.9.2", features = ["json"] }
clap.workspace = true
clap_complete.workspace = true
comfy-table.workspace = true
# RPC: connect-rust speaking the gRPC protocol over HTTP/2 + rustls (ADR 0003).
connectrpc = { version = "=0.9.1", features = ["client", "client-tls"] }
cucina-api = { path = "../cucina-api" }
dirs.workspace = true
futures.workspace = true
# `http::Uri` for connect-rust client configs (hyperium/http; already in the graph).
http = "1.3"
# gRPC through HTTP proxies (connect-rust has none; ADR 0808): reqwest's proxy matcher
# (env + system settings), TLS over the CONNECT tunnel, connect-rust's connector trait.
# All three are already in the graph through reqwest and connectrpc.
hyper-util = { version = "0.1.21", default-features = false, features = ["client-proxy", "client-proxy-system", "tokio"] }
indicatif.workspace = true
jiff.workspace = true
jsonwebtoken.workspace = true
keyring.workspace = true
oauth2.workspace = true
openidconnect = { workspace = true, features = ["accept-string-booleans", "timing-resistant-secret-traits"] }
ratatui.workspace = true
reqwest.workspace = true
rustls.workspace = true
rustls-pki-types.workspace = true
rustls-platform-verifier.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-rustls = { version = "0.26.6", default-features = false }
tokio-stream.workspace = true
toml.workspace = true
tower-service = "0.3.3"
tracing.workspace = true
tracing-subscriber.workspace = true
zstd.workspace = true

# Advisory file lock for the token cache (flock); already in the graph via
# crossterm/terminal_size. Windows uses an exclusive share-mode open (std only).
# ADR 0801.
# Browser launch everywhere but macOS, where `open -u` avoids linking AppKit (ADR 0806).
[target.'cfg(not(target_os = "macos"))'.dependencies]
webbrowser.workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.5", default-features = false, features = ["std", "fs"] }

[dev-dependencies]
assert_cmd.workspace = true
aws-lc-rs.workspace = true
# Fake OIDC/STS/GitHub servers in tests (JSON and form bodies).
axum = { workspace = true, features = ["json", "form"] }
insta.workspace = true
predicates.workspace = true
proptest.workspace = true
# Throwaway private CA/server certificates for TLS transport tests (ADR 0808).
rcgen = { version = "=0.14.10", default-features = false, features = ["aws_lc_rs", "pem"] }
# Fake REAPI/management servers in tests (connect-rust server, gRPC protocol).
connectrpc = { version = "=0.9.1", features = ["client", "client-tls", "server"] }

[target.'cfg(unix)'.dev-dependencies]
rexpect.workspace = true

[target.'cfg(windows)'.dev-dependencies]
expectrl.workspace = true

[lints]
workspace = true
